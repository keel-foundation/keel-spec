openapi: 3.1.0
info:
  title: KeelTube demo API
  version: 0.1.0
  description: |
    Draft contract for the local KeelTube demo. Core runs on port 8080 and
    moderation runs on port 8082. The demo token is optional locally and
    required when KEELTUBE_DEMO_TOKEN is set.

    Moderation v0.1 is frozen as of 2026-11-01. Additive changes only until
    v0.2; see DECISIONS.md.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
tags:
  - name: core
  - name: moderation
  - name: internal
paths:
  /health:
    get:
      tags: [core, moderation]
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /api/v1/channels/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo channel
      responses:
        "200":
          description: Demo channel
          content:
            application/json:
              schema:
                $ref: "./channel.schema.json"
  /api/v1/channels/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "./channel.schema.json"
        "404":
          description: Channel not found
  /api/v1/videos/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo video
      responses:
        "200":
          description: Demo video
          content:
            application/json:
              schema:
                $ref: "./video.schema.json"
  /api/v1/videos/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "./video.schema.json"
        "404":
          description: Video not found
  /api/v1/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo video and channel
      responses:
        "200":
          description: Demo payload
          content:
            application/json:
              schema:
                type: object
                required: [video, channel]
                properties:
                  video:
                    $ref: "./video.schema.json"
                  channel:
                    $ref: "./channel.schema.json"
  /api/v1/me:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Current principal
      description: |
        Session-authenticated principal. The dev bearer token remains available as a local
        fallback when KEELTUBE_DEV_ACTOR_TOKEN is set.
      security:
        - sessionCookie: []
        - devToken: []
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: A dev actor token is required
  /api/v1/videos/{id}/view:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Start a playback session
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartViewRequest"
      responses:
        "200":
          description: Playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartViewResponse"
        "404":
          description: Video not found or not accessible
        "410":
          description: Video was removed
  /api/v1/videos/{id}/view/progress:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Send a playback heartbeat
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewProgressRequest"
      responses:
        "200":
          description: Updated playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewProgressResponse"
        "404":
          description: Session or video not found
  /api/v1/telemetry/events:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Record impression and click telemetry
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "200":
          description: Telemetry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResult"
  /api/v1/studio/analytics/summary:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Creator analytics summary
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Creator analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResponse"
  /api/v1/studio/analytics/timeseries:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Creator analytics daily time series
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Creator analytics points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsTimeseriesResponse"
  /api/v1/studio/videos/{id}/analytics:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Per-video creator analytics
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Per-video analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAnalyticsResponse"
        "404":
          description: Video not found for this creator
  /api/v1/feed:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Personalized or cold-start feed
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendedVideoPage"
  /api/v1/explore:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Featured, new, trending, and curated collections
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 8
        - name: collection_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 4
      responses:
        "200":
          description: Explore payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreResponse"
  /api/v1/videos:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List public videos
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
        - name: channel_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
  /api/v1/videos/{id}/related:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Related videos
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Related video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "404":
          description: Video not found or not accessible
        "410":
          description: Video was removed
  /api/v1/shorts:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List public shorts
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: channel_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shorts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
  /api/v1/search:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Search public videos and channels
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: type
          in: query
          schema:
            type: string
            enum: [all, videos, shorts, channels]
            default: all
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: Invalid query
  /api/v1/categories:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Public category counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
  /api/v1/channels/{id}/videos:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List a channel's public videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
      responses:
        "200":
          description: Channel video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "404":
          description: Channel not found
  /api/v1/auth/register:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "409":
          description: Email already registered
        "422":
          description: Request validation failed
        "429":
          description: Rate limit exceeded
  /api/v1/auth/verify-email:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Verify an email code and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid or expired code
        "429":
          description: Rate limit exceeded
  /api/v1/auth/resend-verification:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Resend a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification code sent when the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevDeliveryResponse"
        "429":
          description: Rate limit exceeded
  /api/v1/auth/login:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified
        "429":
          description: Rate limit exceeded
  /api/v1/auth/logout:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: End the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session ended
  /api/v1/auth/session:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: No active session
  /api/v1/auth/csrf:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Rotate the CSRF cookie for the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          description: No active session
  /api/v1/auth/forgot-password:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Reset link sent when the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevDeliveryResponse"
        "429":
          description: Rate limit exceeded
  /api/v1/auth/reset-password:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Reset a password with a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid or expired reset token
        "429":
          description: Rate limit exceeded
  /api/v1/channels/{id}/subscription:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read subscription state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          description: A session is required
    post:
      tags: [core]
      summary: Subscribe to a channel
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          description: A session is required
        "403":
          description: CSRF validation failed
    delete:
      tags: [core]
      summary: Unsubscribe from a channel
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          description: A session is required
        "403":
          description: CSRF validation failed
  /api/v1/me/subscriptions:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List subscribed channels
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Subscribed channel page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelPage"
        "401":
          description: A session is required
  /api/v1/me/feed:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Public videos from subscribed channels
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
      responses:
        "200":
          description: Subscription feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "401":
          description: A session is required
  /api/v1/me/library:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read saved, liked, or watch-history videos
      security:
        - sessionCookie: []
      parameters:
        - name: tab
          in: query
          schema:
            type: string
            enum: [saved, liked, history]
            default: saved
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Library page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "401":
          description: A session is required
        "422":
          description: Invalid tab
  /api/v1/me/history:
    servers:
      - url: http://localhost:8080
    delete:
      tags: [core]
      summary: Clear watch history
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: History cleared
        "401":
          description: A session is required
        "403":
          description: CSRF validation failed
  /api/v1/videos/{id}/reaction:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read the current reaction
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: Reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"
    put:
      tags: [core]
      summary: Set a like or dislike
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactionRequest"
      responses:
        "200":
          description: Reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"
        "422":
          description: Invalid reaction kind
    delete:
      tags: [core]
      summary: Clear the current reaction
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Reaction state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponse"
  /api/v1/videos/{id}/save:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read the saved state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
      responses:
        "200":
          description: Save state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResponse"
    put:
      tags: [core]
      summary: Save a video
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Save state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResponse"
    delete:
      tags: [core]
      summary: Remove a saved video
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Save state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResponse"
  /api/v1/videos/{id}/comments:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List visible comments and replies
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - name: sort
          in: query
          schema:
            type: string
            enum: [top, newest]
            default: top
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Comment page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "404":
          description: Video not found or not accessible
        "410":
          description: Video was removed
    post:
      tags: [core]
      summary: Post a comment or one-level reply
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreateRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: A session is required
        "422":
