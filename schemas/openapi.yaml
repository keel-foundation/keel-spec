        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    VideoCut:
      type: object
      required: [start, end]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          minimum: 0
    VideoAudioTrack:
      type: object
      required: [name, url, volume]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        volume:
          type: number
          minimum: 0
          maximum: 2
