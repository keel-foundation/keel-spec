    ActionCreate:
      type: object
      additionalProperties: false
      required: [video_id, policy_clause, reason, evidence]
      properties:
        video_id:
          type: string
          pattern: "^vid_[a-zA-Z0-9_]+$"
          maxLength: 80
        channel_id:
          type: string
          pattern: "^ch_[a-zA-Z0-9_]+$"
          maxLength: 80
          default: ch_demo
        policy_clause:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        evidence:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
    AppealCreate:
      type: object
      additionalProperties: false
      required: [grounds, statement]
      properties:
        grounds:
          type: string
          enum:
