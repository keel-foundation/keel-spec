        volume:
          type: number
          minimum: 0
          maximum: 2
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    VideoVersionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VideoVersion"
