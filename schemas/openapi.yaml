openapi: 3.1.0
info:
  title: KeelTube demo API
  version: 0.1.0
  description: |
    Draft contract for the local KeelTube demo. Core runs on port 8080 and
    moderation runs on port 8082. Moderation requires OIDC claims or all three
    role tokens and fails closed when authentication is not configured.

    Moderation v0.1 is frozen as of 2026-11-01. Additive changes only until
    v0.2; see DECISIONS.md.
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/
tags:
  - name: core
  - name: moderation
  - name: internal
paths:
  /health:
    get:
      tags: [core, moderation]
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                  service:
                    type: string
  /api/v1/channels/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo channel
      responses:
        "200":
          description: Demo channel
          content:
            application/json:
              schema:
                $ref: "./channel.schema.json"
  /api/v1/channels/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read a channel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "./channel.schema.json"
        "404":
          description: Channel not found
  /api/v1/videos/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo video
      responses:
        "200":
          description: Demo video
          content:
            application/json:
              schema:
                $ref: "./video.schema.json"
  /api/v1/videos/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read a video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video
          content:
            application/json:
              schema:
                $ref: "./video.schema.json"
        "404":
          description: Video not found
        "410":
          description: Video was removed; the body carries a canonical tombstone record
          content:
            application/json:
              schema:
                type: object
                required: [detail, video]
                properties:
                  detail:
                    type: string
                  video:
                    $ref: "#/components/schemas/VideoTombstone"
  /api/v1/demo:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Demo video and channel
      responses:
        "200":
          description: Demo payload
          content:
            application/json:
              schema:
                type: object
                required: [video, channel]
                properties:
                  video:
                    $ref: "./video.schema.json"
                  channel:
                    $ref: "./channel.schema.json"
  /api/v1/me:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Current principal
      description: |
        Session-authenticated principal. The dev bearer token remains available as a local
        fallback when KEELTUBE_DEV_ACTOR_TOKEN is set.
      security:
        - sessionCookie: []
        - devToken: []
      responses:
        "200":
          description: Current principal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Principal"
        "401":
          description: A dev actor token is required
  /api/v1/videos/{id}/view:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Start a playback session
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartViewRequest"
      responses:
        "200":
          description: Playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartViewResponse"
        "404":
          description: Video not found or not accessible
        "410":
          description: Video was removed
  /api/v1/videos/{id}/view/progress:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Send a playback heartbeat
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewProgressRequest"
      responses:
        "200":
          description: Updated playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewProgressResponse"
        "404":
          description: Session or video not found
  /api/v1/telemetry/events:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Record impression and click telemetry
      security:
        - {}
        - sessionCookie: []
        - devToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatch"
      responses:
        "200":
          description: Telemetry result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResult"
  /api/v1/studio/analytics/summary:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Creator analytics summary
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Creator analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResponse"
  /api/v1/studio/analytics/timeseries:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Creator analytics daily time series
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Creator analytics points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsTimeseriesResponse"
  /api/v1/studio/videos/{id}/analytics:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Per-video creator analytics
      security:
        - sessionCookie: []
        - devToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Per-video analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoAnalyticsResponse"
        "404":
          description: Video not found for this creator
  /.well-known/webfinger:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Resolve a local actor by acct URI
      parameters:
        - name: resource
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WebFinger JRD
          content:
            application/jrd+json:
              schema:
                type: object
        "404":
          description: Actor not found
  /federation/actors/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read an ActivityPub actor document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Actor document
          content:
            application/activity+json:
              schema:
                type: object
        "404":
          description: Actor not found
  /federation/actors/{id}/outbox:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read an actor outbox
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ordered collection of Create activities
          content:
            application/activity+json:
              schema:
                type: object
  /federation/actors/{id}/followers:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read an actor followers collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Followers collection
          content:
            application/activity+json:
              schema:
                type: object
  /federation/actors/{id}/following:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read an actor following collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Following collection
          content:
            application/activity+json:
              schema:
                type: object
  /federation/actors/{id}/inbox:
    servers:
      - url: http://localhost:8080
    post:
      tags: [federation]
      summary: Receive a signed ActivityPub activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Activity accepted or already processed
        "401":
          description: Missing or invalid HTTP signature
        "403":
          description: Blocked peer or mismatched actor
  /federation/videos/{id}:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read a public video as a PeerTube-compatible object
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video object
          content:
            application/activity+json:
              schema:
                type: object
        "404":
          description: Video not found or not public
  /federation/policy:
    servers:
      - url: http://localhost:8080
    get:
      tags: [federation]
      summary: Read the signed instance policy document
      responses:
        "200":
          description: Instance policy
          content:
            application/activity+json:
              schema:
                type: object
  /api/v1/feed:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Personalized or cold-start feed
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendedVideoPage"
  /api/v1/explore:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Featured, new, trending, and curated collections
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 8
        - name: collection_limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 4
      responses:
        "200":
          description: Explore payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreResponse"
  /api/v1/videos:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List public videos
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
        - name: channel_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
  /api/v1/videos/{id}/related:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Related videos
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/VideoID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Related video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "404":
          description: Video not found or not accessible
        "410":
          description: Video was removed
  /api/v1/shorts:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List public shorts
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: channel_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shorts page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
  /api/v1/search:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Search public videos and channels
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: type
          in: query
          schema:
            type: string
            enum: [all, videos, shorts, channels]
            default: all
        - name: channel_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "422":
          description: Invalid query
  /api/v1/categories:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Public category counts
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
  /api/v1/channels/{id}/videos:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List a channel's public videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, oldest, trending, views]
        - name: format
          in: query
          schema:
            type: string
            enum: [video, short]
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/VideoCategory"
      responses:
        "200":
          description: Channel video page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPage"
        "404":
          description: Channel not found
  /api/v1/auth/register:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResult"
        "409":
          description: Email already registered
        "422":
          description: Request validation failed
        "429":
          description: Rate limit exceeded
  /api/v1/auth/verify-email:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Verify an email code and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid or expired code
        "429":
          description: Rate limit exceeded
  /api/v1/auth/resend-verification:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Resend a verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Verification code sent when the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevDeliveryResponse"
        "429":
          description: Rate limit exceeded
  /api/v1/auth/login:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified
        "429":
          description: Rate limit exceeded
  /api/v1/auth/logout:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: End the current session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session ended
  /api/v1/auth/session:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Active session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          description: No active session
  /api/v1/auth/csrf:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Rotate the CSRF cookie for the current session
      security:
        - sessionCookie: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfResponse"
        "401":
          description: No active session
  /api/v1/auth/forgot-password:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Request a password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Reset link sent when the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevDeliveryResponse"
        "429":
          description: Rate limit exceeded
  /api/v1/auth/reset-password:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Reset a password with a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid or expired reset token
        "429":
          description: Rate limit exceeded
  /api/v1/auth/social/providers:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List configured social sign-in providers
      responses:
        "200":
          description: Configured providers
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name]
                      properties:
                        id:
                          type: string
                        name:
                          type: string
  /api/v1/auth/social/{provider}/start:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Start a social OIDC or OAuth sign-in
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: return_to
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json]
      responses:
        "302":
          description: Redirect to the provider
        "200":
          description: Provider URL when format=json
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url, expires_at]
                properties:
                  authorization_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        "404":
          description: Provider not configured
        "429":
          description: Rate limit exceeded
  /api/v1/auth/social/{provider}/callback:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Complete a social OIDC or OAuth sign-in
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json]
      responses:
        "302":
          description: Redirect back to the web app with session cookies
        "200":
          description: Active session when format=json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid or expired state
        "401":
          description: Invalid provider claims
        "502":
          description: Provider token exchange failed
    post:
      tags: [core]
      summary: Complete an Apple form_post callback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect back to the web app with session cookies
        "400":
          description: Invalid or expired state
  /api/v1/channels/{id}/subscription:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: Read subscription state
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          description: A session is required
    post:
      tags: [core]
      summary: Subscribe to a channel
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"
        "401":
          description: A session is required
        "403":
          description: CSRF validation failed
    delete:
      tags: [core]
      summary: Unsubscribe from a channel
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ChannelID"
