          $ref: "#/components/schemas/VideoTrim"
        cuts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VideoCut"
        audio:
          $ref: "#/components/schemas/VideoAudioTrack"
        volume:
          type: number
          minimum: 0
          maximum: 2
