      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        visibility:
          $ref: "#/components/schemas/VideoVisibility"
        category:
          $ref: "#/components/schemas/VideoCategory"
        license:
          type: string
          enum: [standard, cc-by, cc-by-sa, cc0, all-rights-reserved]
        format:
          type: string
          enum: [video, short]
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
        expected_updated_at:
          type: string
          format: date-time
    VideoRights:
      type: object
      properties:
        declaration:
          type: string
          enum: [original, licensed, public_domain, fair_use]
        holder:
          type: string
        notes:
          type: string
