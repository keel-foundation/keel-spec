  /internal/v1/billing/settlements:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Settle a creator's available balance through Stripe Connect
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel_id, period]
              properties:
                channel_id:
                  type: string
                period:
                  type: string
                  pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: Created or idempotent settlement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "401":
          description: Internal token required
        "409":
          description: Settlement cannot be created
        "422":
          description: Invalid settlement request
        "502":
          description: Stripe request failed
        "503":
          description: Stripe billing is not configured
  /webhooks/stripe:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Verify and process a Stripe webhook
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook accepted
        "400":
          description: Invalid Stripe signature or body
        "500":
          description: Webhook processing failed
        "503":
          description: Stripe webhooks are not configured
  /api/v1/me/password:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Change the current account password
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; other sessions revoked
        "403":
          description: Current password is incorrect
        "422":
          description: Invalid new password
  /api/v1/me/sessions:
    servers:
      - url: http://localhost:8080
    get:
      tags: [core]
      summary: List account sessions
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
  /api/v1/me/sessions/{id}:
    servers:
      - url: http://localhost:8080
    delete:
      tags: [core]
      summary: Revoke one account session
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Session revoked
        "404":
          description: Session not found
  /api/v1/me/sessions/revoke-others:
    servers:
      - url: http://localhost:8080
    post:
      tags: [core]
      summary: Revoke all other account sessions
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Other sessions revoked
components:
  securitySchemes:
    demoToken:
      type: http
      scheme: bearer
    devToken:
      type: http
      scheme: bearer
      description: Dev-only actor token for core; set KEELTUBE_DEV_ACTOR_TOKEN.
    sessionCookie:
      type: apiKey
      in: cookie
      name: keeltube_session
      description: HttpOnly browser session cookie issued by core.
    internalToken:
      type: http
      scheme: bearer
      description: Service-to-service token; set KEELTUBE_INTERNAL_TOKEN on core or KEELTUBE_SIGNAL_INGEST_TOKEN on moderation.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    VideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ChannelID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    StudioVideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UploadID:
      name: id
      in: path
      required: true
      schema:
        type: string
    MediaVideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ModerationRecordID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ModerationLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request authenticates with the session cookie.
      schema:
        type: string
    CreatorChannel:
      name: channel_id
      in: query
      required: false
      description: Required when the authenticated creator principal has multiple channel claims.
      schema:
        type: string
        pattern: "^ch_[a-zA-Z0-9_]+$"
        maxLength: 80
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        field:
          type: string
    ModerationSummary:
      type: object
      required: [channel_id]
      properties:
        channel_id:
          type: string
        cases_total:
          type: integer
        open_cases:
          type: integer
        actions_total:
          type: integer
        active_actions:
          type: integer
        appeals_total:
          type: integer
        pending_appeals:
          type: integer
        decided_appeals:
          type: integer
        ledger_records:
          type: integer
    ModerationCasePage:
      type: object
      required: [cases, total, limit, offset, channel_id]
      properties:
        cases:
          type: array
          items:
            $ref: "./moderation-case.schema.json"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        channel_id:
          type: string
    ModerationActionPage:
      type: object
      required: [actions, total, limit, offset, channel_id]
      properties:
        actions:
          type: array
          items:
            $ref: "./enforcement-action.schema.json"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        channel_id:
          type: string
    ModerationAppealPage:
      type: object
      required: [appeals, total, limit, offset, channel_id]
      properties:
        appeals:
          type: array
          items:
            $ref: "./appeal.schema.json"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        channel_id:
          type: string
    ModerationLedgerPage:
      type: object
      required: [ledger, verification, total, limit, offset, channel_id]
      properties:
        ledger:
          type: array
          items:
            $ref: "./audit-record.schema.json"
        verification:
          $ref: "#/components/schemas/ModerationVerification"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        channel_id:
          type: string
    ModerationVerification:
      type: object
      required: [valid, records, head]
      properties:
        valid:
          type: boolean
        records:
          type: integer
        head:
          type: string
        first_broken:
          type: [integer, "null"]
        reason:
          type: [string, "null"]
    ModerationAppealRequest:
      type: object
      additionalProperties: false
      required: [grounds, statement]
      properties:
        grounds:
          type: string
          enum: [new_evidence, procedural_error, policy_misapplication, identity, other]
        statement:
          type: string
          minLength: 1
          maxLength: 4000
    SignalCreate:
      type: object
      additionalProperties: false
      required: [subject_type, subject_id, channel_id, reason, details]
      properties:
        subject_type:
          type: string
          enum: [video, channel]
        subject_id:
          type: string
          minLength: 1
          maxLength: 80
        channel_id:
          type: string
          pattern: "^ch_[a-zA-Z0-9_]+$"
        reason:
          type: string
          enum: [spam, scam, piracy, impersonation, harassment, csam, copyright, terrorism, other]
        details:
          type: string
          minLength: 1
          maxLength: 4000
        reporter_id:
          type: string
          maxLength: 80
    ReportRequest:
