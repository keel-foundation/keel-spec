          type: string
        subscribed:
          type: boolean
        subscribers:
          type: integer
    ReactionRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [like, dislike]
    ReactionResponse:
      type: object
      required: [video_id, kind, likes]
      properties:
        video_id:
          type: string
        kind:
          oneOf:
            - type: string
              enum: [like, dislike]
            - type: "null"
        likes:
          type: integer
    SaveResponse:
      type: object
      required: [video_id, saved]
      properties:
        video_id:
          type: string
        saved:
          type: boolean
    Notification:
      type: object
      required: [id, kind, title, body, href, read, created_at]
      properties:
        id:
          type: string
        channel_id:
          type: string
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        href:
          type: string
        payload:
          type: object
          additionalProperties: true
        read:
          type: boolean
        read_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items, limit, offset, total, has_more, unread_count]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
        unread_count:
          type: integer
    UnreadNotificationResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer
    MarkAllNotificationsResponse:
      type: object
      required: [updated, unread_count]
      properties:
        updated:
          type: integer
        unread_count:
          type: integer
    NotificationIngestRequest:
      type: object
      additionalProperties: false
      required: [actor_id, kind, title]
      properties:
        actor_id:
          type: string
        channel_id:
          type: string
        kind:
          type: string
          maxLength: 64
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 1000
        href:
          type: string
          maxLength: 500
        payload:
          type: object
          additionalProperties: true
        dedupe_key:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, account_id, name, handle, role, channel_id, email, email_verified]
      properties:
        id:
          type: string
        account_id:
          type: string
        name:
          type: string
        handle:
          type: string
        role:
          type: string
        channel_id:
          type: string
        avatar_url:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
    SessionResponse:
      type: object
      required: [user, provider, signed_in_at, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        provider:
          type: string
        signed_in_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    RegisterResult:
      type: object
      required: [user, email, verification_required, verification_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        email:
          type: string
          format: email
        verification_required:
          type: boolean
        verification_expires_at:
          type: string
          format: date-time
        dev_code:
          type: string
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: "^[0-9]{6}$"
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8
    CsrfResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
    DevDeliveryResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        dev_code:
          type: string
        dev_token:
          type: string
        expires_at:
          type: string
          format: date-time
    StudioChannelResponse:
      type: object
      required: [channel]
      properties:
        channel:
          $ref: "./channel.schema.json"
    StudioVideoPage:
      type: object
      required: [items, limit, offset, total, has_more]
