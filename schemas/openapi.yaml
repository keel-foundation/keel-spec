            - procedural_error
            - policy_misapplication
            - identity
            - other
        statement:
          type: string
          minLength: 1
          maxLength: 4000
    AppealDecision:
      type: object
      additionalProperties: false
      required: [decision, reasoning]
      properties:
        decision:
          type: string
          enum: [reverse, uphold]
        reasoning:
