components:
  securitySchemes:
    demoToken:
      type: http
      scheme: bearer
    devToken:
      type: http
      scheme: bearer
      description: Dev-only actor token for core; set KEELTUBE_DEV_ACTOR_TOKEN.
    sessionCookie:
      type: apiKey
      in: cookie
      name: keeltube_session
      description: HttpOnly browser session cookie issued by core.
    internalToken:
      type: http
      scheme: bearer
      description: Service-to-service token; set KEELTUBE_INTERNAL_TOKEN on core.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    VideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ChannelID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CommentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    StudioVideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    UploadID:
      name: id
      in: path
      required: true
      schema:
        type: string
    MediaVideoID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required when the request authenticates with the session cookie.
      schema:
        type: string
    CreatorChannel:
      name: channel_id
      in: query
      required: false
      description: Required when the authenticated creator principal has multiple channel claims.
      schema:
        type: string
        pattern: "^ch_[a-zA-Z0-9_]+$"
        maxLength: 80
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
        field:
          type: string
    VideoCategory:
      type: string
      enum: [Documentaries, Protocol, Moderation, Studio, Federation]
    VideoVisibility:
      type: string
      enum: [public, unlisted, private]
    VideoPage:
      type: object
      required: [items, limit, offset, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "./video.schema.json"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
    Reason:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum:
            - subscription
            - category
            - because_you_watched
            - because_you_liked
            - because_you_saved
            - recently_watched
            - trending
            - new
            - recommended
        label:
          type: string
        source_video_id:
          type: string
        source_title:
          type: string
        category:
          type: string
        channel_id:
          type: string
    RecommendedVideo:
      allOf:
        - $ref: "./video.schema.json"
        - type: object
          properties:
            reason:
              $ref: "#/components/schemas/Reason"
            score:
              type: number
    RecommendedVideoPage:
      type: object
      required: [items, limit, offset, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecommendedVideo"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
    ChannelPage:
      type: object
      required: [items, limit, offset, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "./channel.schema.json"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
    ExploreCollection:
      type: object
      required: [id, title, description, videos]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        reason:
          $ref: "#/components/schemas/Reason"
        videos:
          $ref: "#/components/schemas/RecommendedVideoPage"
    ExploreResponse:
      type: object
      required: [featured, new, trending, collections]
      properties:
        featured:
          oneOf:
            - $ref: "#/components/schemas/RecommendedVideo"
            - type: "null"
        new:
          $ref: "#/components/schemas/RecommendedVideoPage"
        trending:
          $ref: "#/components/schemas/RecommendedVideoPage"
        collections:
          type: array
          items:
            $ref: "#/components/schemas/ExploreCollection"
    SearchResponse:
      type: object
      required: [videos, channels]
      properties:
        videos:
          $ref: "#/components/schemas/VideoPage"
        channels:
          $ref: "#/components/schemas/ChannelPage"
    Category:
      type: object
      required: [name, video_count]
      properties:
        name:
          $ref: "#/components/schemas/VideoCategory"
        video_count:
          type: integer
    CategoriesResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Comment:
      type: object
      required: [id, video_id, actor_id, author, handle, body, likes, pinned, status, created_at, updated_at]
      properties:
        id:
          type: string
        video_id:
          type: string
        parent_id:
          type: string
        actor_id:
          type: string
        author:
          type: string
        handle:
          type: string
        avatar_url:
          type: string
          format: uri
        body:
          type: string
        likes:
          type: integer
        pinned:
          type: boolean
        status:
          type: string
          enum: [visible, hidden, removed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CommentPage:
      type: object
      required: [items, limit, offset, total, has_more]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
    CommentCreateRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        parent_id:
          type: string
    CommentLikeResponse:
      type: object
      required: [comment_id, liked, likes]
      properties:
        comment_id:
          type: string
        liked:
          type: boolean
        likes:
          type: integer
    SubscriptionResponse:
