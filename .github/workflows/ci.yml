name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: pip install -r requirements-dev.lock
      - name: Validate schemas, examples, and OpenAPI
        run: python scripts/validate_schemas.py
  docs:
    uses: keel-foundation/.github/.github/workflows/docs-ci.yml@b10fea5cfdb6d01876e3c5c9dcd0993ea54f3a41 # pinned for supply-chain safety
